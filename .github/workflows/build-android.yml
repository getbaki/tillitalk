name: Build TilliTalk Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$MANAGER" ]; then
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          dirname "$MANAGER" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$MANAGER" --sdk_root="$SDK" --licenses
          set -o pipefail
          "$MANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install --no-save @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm run build
          test -s dist/lessons/manifest.json
          test -d dist/lessons/media
      - name: Prepare Android project
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.js ]; then
            npx cap init TilliTalk nl.talesbymoonlight.tillitalk --web-dir dist
          fi
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Generate TilliTalk launcher icons
        run: |
          test -s public/TilliTalk-Launcher.png
          python3 -m pip install Pillow
          python3 <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          source = Image.open("public/TilliTalk-Launcher.png").convert("RGBA")
          root = Path("android/app/src/main/res")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              for name in ["ic_launcher", "ic_launcher_round"]:
                  icon = Image.new("RGBA", (size, size), "white")
                  art = ImageOps.contain(source, (int(size * 0.78), int(size * 0.78)), Image.Resampling.LANCZOS)
                  icon.alpha_composite(art, ((size-art.width)//2, (size-art.height)//2))
                  icon.convert("RGB").save(folder / f"{name}.png")

          for folder in root.glob("mipmap-anydpi*"):
              for name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
                  (folder / name).unlink(missing_ok=True)

          print("TilliTalk launcher icons generated successfully.")
          PY
      - name: Build test APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TilliTalk-Android-Test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
